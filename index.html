<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEG Roller Maker</title>
<style>
:root{
  --bg:#111217;--panel:#1b1d24;--panel2:#242733;--text:#f7f7fa;
  --muted:#adb2bf;--line:#343845;--accent:#ef4fa8;--accent2:#b76cff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:1200px;margin:auto;padding:16px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.notice{background:#30273a;border:1px solid #6b4b82;padding:11px;border-radius:10px;margin:0 0 14px;font-size:13px}
.grid{display:grid;grid-template-columns:350px 1fr;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px}
label{display:block;font-weight:700;margin:12px 0 6px}
input[type=file]{width:100%}
input[type=number]{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:white;font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.toggle{display:flex;align-items:center;gap:8px;margin-top:12px}
.toggle label{margin:0}
button{width:100%;border:0;border-radius:10px;padding:12px 13px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2))}
button.secondary{background:var(--panel2);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
.buttons{display:grid;gap:8px;margin-top:13px}
#imgPreview{width:100%;aspect-ratio:2/1;background:#fff;border-radius:10px;margin-top:10px;display:block}
#viewer{width:100%;height:70vh;min-height:480px;background:#0d0e12;border-radius:12px;display:block;touch-action:none}
.status{color:var(--muted);font-size:13px;margin-top:9px;min-height:20px}
.small{font-size:12px;color:var(--muted)}
.bad{color:#ff9b9b}
.good{color:#9ff0b3}
@media(max-width:820px){
 .grid{grid-template-columns:1fr}
 #viewer{height:52vh;min-height:390px}
}
</style>
</head>
<body>
<div class="app">
  <h1>MEG Roller Maker</h1>
  <p class="sub">Black & white image → 3D roller → STL</p>

  <noscript>
    <div class="notice bad">
      JavaScript is not running here. Open this file in Safari/Chrome rather than a document preview.
    </div>
  </noscript>

  <div id="jsOk" class="notice good">✓ App engine loaded. You can upload an image.</div>

  <div class="grid">
    <div class="card">
      <label>1. Upload black & white image</label>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
      <div class="small">Black = raised. Use Invert to swap black and white.</div>

      <canvas id="imgPreview" width="700" height="350"></canvas>

      <div class="row">
        <div>
          <label>Length mm</label>
          <input id="length" type="number" min="20" max="300" step="1" value="100">
        </div>
        <div>
          <label>Diameter mm</label>
          <input id="diameter" type="number" min="10" max="150" step="1" value="40">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Relief mm</label>
          <input id="relief" type="number" min="0.1" max="5" step="0.1" value="0.8">
        </div>
        <div>
          <label>Threshold</label>
          <input id="threshold" type="number" min="0" max="255" step="1" value="128">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Repeat around</label>
          <input id="repeatX" type="number" min="1" max="20" step="1" value="1">
        </div>
        <div>
          <label>Repeat length</label>
          <input id="repeatY" type="number" min="1" max="20" step="1" value="1">
        </div>
      </div>

      <div class="toggle">
        <input id="invert" type="checkbox">
        <label for="invert">Invert black / white</label>
      </div>

      <div class="buttons">
        <button id="build" disabled>Generate 3D Roller</button>
        <button id="download" class="secondary" disabled>Download STL</button>
      </div>

      <div id="status" class="status">Upload an image to start.</div>
    </div>

    <div class="card">
      <canvas id="viewer" width="900" height="700"></canvas>
      <div class="small">Drag to rotate • Pinch/wheel to zoom</div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const $ = id => document.getElementById(id);
const file = $("file"), buildBtn=$("build"), dlBtn=$("download"), status=$("status");
const pc=$("imgPreview"), pctx=pc.getContext("2d");
const view=$("viewer"), vctx=view.getContext("2d");

let srcCanvas=document.createElement("canvas");
let srcCtx=srcCanvas.getContext("2d",{willReadFrequently:true});
let srcPixels=null, srcW=0, srcH=0, loaded=false;
let mesh=null;
let rotX=-0.25, rotY=0.65, zoom=1.0;

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function drawPlaceholder(){
  pctx.fillStyle="#fff"; pctx.fillRect(0,0,pc.width,pc.height);
  pctx.fillStyle="#999"; pctx.font="26px -apple-system,Arial";
  pctx.textAlign="center"; pctx.textBaseline="middle";
  pctx.fillText("Your black & white pattern will appear here",pc.width/2,pc.height/2);
}
drawPlaceholder();

file.addEventListener("change", function(){
  const f=file.files && file.files[0];
  if(!f) return;

  status.textContent="Loading image…";
  const reader=new FileReader();
  reader.onerror=()=> status.textContent="Could not read this image.";
  reader.onload=function(e){
    const img=new Image();
    img.onerror=()=> status.textContent="This image format could not be opened.";
    img.onload=function(){
      const max=1000;
      let w=img.naturalWidth, h=img.naturalHeight;
      const s=Math.min(1,max/Math.max(w,h));
      w=Math.max(2,Math.round(w*s)); h=Math.max(2,Math.round(h*s));

      srcCanvas.width=w; srcCanvas.height=h;
      srcCtx.clearRect(0,0,w,h);
      srcCtx.drawImage(img,0,0,w,h);

      try{
        srcPixels=srcCtx.getImageData(0,0,w,h).data;
      }catch(err){
        status.textContent="Browser blocked image processing. Open the file in Safari or Chrome.";
        return;
      }

      srcW=w; srcH=h; loaded=true;
      buildBtn.disabled=false;
      updatePatternPreview();
      status.textContent="Image loaded ✓ Press Generate 3D Roller.";
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
});

["threshold","repeatX","repeatY","invert"].forEach(id=>{
  $(id).addEventListener("input",()=>{ if(loaded) updatePatternPreview(); });
});

function sampleMask(u,v){
  if(!srcPixels) return 0;
  const rx=clamp(parseInt($("repeatX").value)||1,1,20);
  const ry=clamp(parseInt($("repeatY").value)||1,1,20);

  let uu=((u*rx)%1+1)%1;
  let vv=((v*ry)%1+1)%1;

  const x=clamp(Math.floor(uu*srcW),0,srcW-1);
  const y=clamp(Math.floor((1-vv)*srcH),0,srcH-1);
  const i=(y*srcW+x)*4;
  const lum=.2126*srcPixels[i]+.7152*srcPixels[i+1]+.0722*srcPixels[i+2];
  let isBlack=lum < (parseInt($("threshold").value)||128);
  if($("invert").checked) isBlack=!isBlack;
  return isBlack?1:0;
}

function updatePatternPreview(){
  const W=pc.width,H=pc.height;
  const out=pctx.createImageData(W,H);
  for(let y=0;y<H;y++){
    const v=1-y/(H-1);
    for(let x=0;x<W;x++){
      const m=sampleMask(x/(W-1),v);
      const c=m?0:255;
      const i=(y*W+x)*4;
      out.data[i]=c;out.data[i+1]=c;out.data[i+2]=c;out.data[i+3]=255;
    }
  }
  pctx.putImageData(out,0,0);
}

buildBtn.addEventListener("click", buildMesh);
dlBtn.addEventListener("click", downloadSTL);

function buildMesh(){
  if(!loaded) return;
  status.textContent="Generating 3D geometry…";

  // Slight delay lets the status paint before the heavier work starts.
  setTimeout(()=>{
    const L=clamp(parseFloat($("length").value)||100,20,300);
    const D=clamp(parseFloat($("diameter").value)||40,10,150);
    const R=D/2;
    const relief=clamp(parseFloat($("relief").value)||.8,.1,5);

    // Resolution balanced for phones.
    const NA=160, NZ=100;
    const vertices=[];
    const faces=[];

    for(let j=0;j<=NZ;j++){
      const v=j/NZ;
      const yy=(v-.5)*L;
      for(let i=0;i<=NA;i++){
        const u=i/NA;
        const a=u*Math.PI*2;
        const rr=R+relief*sampleMask(u,v);
        vertices.push([rr*Math.cos(a),yy,rr*Math.sin(a)]);
      }
    }

    const row=NA+1;
    for(let j=0;j<NZ;j++){
      for(let i=0;i<NA;i++){
        const a=j*row+i,b=a+1,c=(j+1)*row+i+1,d=(j+1)*row+i;
        faces.push([a,d,b],[b,d,c]);
      }
    }

    const bot=vertices.length; vertices.push([0,-L/2,0]);
    const top=vertices.length; vertices.push([0,L/2,0]);

    for(let i=0;i<NA;i++){
      faces.push([bot,i+1,i]);
      const a=NZ*row+i,b=a+1;
      faces.push([top,a,b]);
    }

    mesh={vertices,faces,L,D,relief};
    dlBtn.disabled=false;
    rotX=-0.25; rotY=0.65; zoom=1;
    render3D();
    status.textContent=`Ready ✓ ${L} mm × Ø${D} mm • relief ${relief} mm`;
  },30);
}

// -------- Standalone software 3D renderer --------
function resizeView(){
  const rect=view.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.max(320,Math.round(rect.width*dpr));
  const h=Math.max(300,Math.round(rect.height*dpr));
  if(view.width!==w||view.height!==h){ view.width=w; view.height=h; }
  render3D();
}
window.addEventListener("resize",resizeView);
setTimeout(resizeView,50);

function projectPoint(p,scale,cx,cy){
  let x=p[0],y=p[1],z=p[2];

  const cyaw=Math.cos(rotY), syaw=Math.sin(rotY);
  let x1=x*cyaw-z*syaw;
  let z1=x*syaw+z*cyaw;

  const cp=Math.cos(rotX), sp=Math.sin(rotX);
  let y2=y*cp-z1*sp;
  let z2=y*sp+z1*cp;

  // Perspective, camera moved forward.
  const cam=260;
  const q=cam/(cam+z2);
  return [cx+x1*scale*q, cy-y2*scale*q, z2];
}

function render3D(){
  const W=view.width,H=view.height;
  const g=vctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#181a22");g.addColorStop(1,"#090a0e");
  vctx.fillStyle=g;vctx.fillRect(0,0,W,H);

  if(!mesh){
    vctx.fillStyle="#8e95a4";
    vctx.font=`${Math.max(16,W/45)}px -apple-system,Arial`;
    vctx.textAlign="center";vctx.textBaseline="middle";
    vctx.fillText("3D preview",W/2,H/2-14);
    vctx.font=`${Math.max(12,W/65)}px -apple-system,Arial`;
    vctx.fillText("Upload an image and generate the roller",W/2,H/2+22);
    return;
  }

  const maxDim=Math.max(mesh.L,mesh.D+mesh.relief*2);
  const scale=(Math.min(W,H)*0.72/maxDim)*zoom;
  const cx=W/2,cy=H/2;

  const projected=mesh.vertices.map(v=>projectPoint(v,scale,cx,cy));

  const tris=[];
  for(const f of mesh.faces){
    const A=projected[f[0]],B=projected[f[1]],C=projected[f[2]];
    const area=(B[0]-A[0])*(C[1]-A[1])-(B[1]-A[1])*(C[0]-A[0]);
    // Back-face cull.
    if(area>=0) continue;

    const depth=(A[2]+B[2]+C[2])/3;
    const va=mesh.vertices[f[0]],vb=mesh.vertices[f[1]],vc=mesh.vertices[f[2]];
    const ux=vb[0]-va[0],uy=vb[1]-va[1],uz=vb[2]-va[2];
    const vx=vc[0]-va[0],vy=vc[1]-va[1],vz=vc[2]-va[2];
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
    const nl=Math.hypot(nx,ny,nz)||1;nx/=nl;ny/=nl;nz/=nl;

    // Fixed light direction.
    const light=clamp(.35 + .65*Math.abs(nx*.5+ny*.65+nz*.55),.18,1);
    tris.push({A,B,C,depth,light});
  }

  tris.sort((a,b)=>b.depth-a.depth);

  for(const t of tris){
    const base=[234,78,166];
    const r=Math.round(base[0]*t.light);
    const gg=Math.round(base[1]*t.light);
    const b=Math.round(base[2]*t.light);
    vctx.beginPath();
    vctx.moveTo(t.A[0],t.A[1]);vctx.lineTo(t.B[0],t.B[1]);vctx.lineTo(t.C[0],t.C[1]);vctx.closePath();
    vctx.fillStyle=`rgb(${r},${gg},${b})`;
    vctx.fill();
  }
}

// Drag / touch rotate
let dragging=false,lastX=0,lastY=0,lastDist=0;

view.addEventListener("pointerdown",e=>{
  dragging=true;lastX=e.clientX;lastY=e.clientY;
  try{view.setPointerCapture(e.pointerId)}catch(_){}
});
view.addEventListener("pointermove",e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  lastX=e.clientX;lastY=e.clientY;
  rotY+=dx*.01;rotX+=dy*.01;
  render3D();
});
view.addEventListener("pointerup",()=>dragging=false);
view.addEventListener("pointercancel",()=>dragging=false);
view.addEventListener("wheel",e=>{
  e.preventDefault();
  zoom=clamp(zoom*(e.deltaY>0?.92:1.08),.4,3);
  render3D();
},{passive:false});

view.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  }
},{passive:true});
view.addEventListener("touchmove",e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(lastDist){zoom=clamp(zoom*(d/lastDist),.4,3);render3D();}
    lastDist=d;
  }
},{passive:true});

// -------- STL --------
function normal(a,b,c){
  const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2];
  const vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
  let x=uy*vz-uz*vy,y=uz*vx-ux*vz,z=ux*vy-uy*vx;
  const l=Math.hypot(x,y,z)||1;return[x/l,y/l,z/l];
}
function fmt(n){return Number(n).toFixed(5)}

function downloadSTL(){
  if(!mesh)return;
  status.textContent="Creating STL…";
  setTimeout(()=>{
    let s="solid MEG_Roller\n";
    for(const f of mesh.faces){
      const a=mesh.vertices[f[0]],b=mesh.vertices[f[1]],c=mesh.vertices[f[2]];
      const n=normal(a,b,c);
      s+=`facet normal ${fmt(n[0])} ${fmt(n[1])} ${fmt(n[2])}\n outer loop\n`;
      s+=`  vertex ${fmt(a[0])} ${fmt(a[1])} ${fmt(a[2])}\n`;
      s+=`  vertex ${fmt(b[0])} ${fmt(b[1])} ${fmt(b[2])}\n`;
      s+=`  vertex ${fmt(c[0])} ${fmt(c[1])} ${fmt(c[2])}\n`;
      s+=" endloop\nendfacet\n";
    }
    s+="endsolid MEG_Roller\n";

    const blob=new Blob([s],{type:"model/stl"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="MEG_Roller.stl";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    status.textContent="STL created ✓";
  },30);
}

})();
</script>
</body>
</html>
